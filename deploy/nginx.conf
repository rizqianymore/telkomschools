# ----------------------------------------------------
# Anti-DDoS & Rate Limiting Zone Definitions
# ----------------------------------------------------
# Limit general requests: max 20 requests/second per IP
limit_req_zone $binary_remote_addr zone=general_limit:10m rate=20r/s;

# Limit dynamic/API requests: max 10 requests/second per IP
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

# Limit simultaneous connections per IP: max 20 connections
limit_conn_zone $binary_remote_addr zone=addr_conn_limit:10m;

# Status code when rate limit is exceeded
limit_req_status 429;
limit_conn_status 429;

server {
    listen 80;
    server_name yourdomain.com www.yourdomain.com;

    # Maximum upload size
    client_max_body_size 20M;

    # Anti-Slowloris / DDoS timeouts
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 15s;
    send_timeout 10s;

    # Custom Anti-DDoS / Rate Limit 429 Error Page
    error_page 429 /custom_429.html;
    location = /custom_429.html {
        root /var/www/telkomschools/deploy/custom_errors;
        try_files /429.html =429;
        internal;
    }

    # Block common malicious bots & scanners
    if ($http_user_agent ~* (SemrushBot|AhrefsBot|DotBot|MJ12bot|MegaIndex|BLEXBot|ZoominfoBot)) {
        return 403;
    }

    # Next.js Static Cache Optimization (tidak terpengaruh rate limit ketat)
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 365d;
        access_log off;
    }

    # General Route with Anti-DDoS Rate Limiting
    location / {
        limit_req zone=general_limit burst=30 nodelay;
        limit_conn addr_conn_limit 20;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        
        # Real IP headers (Support Cloudflare & Direct VPS)
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
